<style>
/* one column, the same on a phone and a wide screen: the preview video first, then the store shots */
body { background: var(--cream); }
.bar { padding-left: max(16px, env(safe-area-inset-left, 0px), calc(50% - 264px)); padding-right: max(16px, env(safe-area-inset-right, 0px), calc(50% - 264px)); }
.col { max-width: 560px; margin: 0 auto; }
.col > section { border-top: 2px solid var(--ink); }
.col > .scape:first-child, .col > .lead, .col > .go { border-top: 0; }
.scape { background: center 30%/cover no-repeat var(--field); }
.scape.top { height: 300px; display: flex; justify-content: center; padding-top: 28px; }
.scape.top .title { width: 240px; height: 126px; filter: drop-shadow(0 3px 0 rgba(26,28,23,.5)); }
.scape.close { padding: 40px 20px; }
.scape.close .last { background: var(--cream); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 22px 18px; display: grid; gap: 14px; text-align: center; }
.lead { display: grid; justify-items: center; gap: 18px; padding: 0 20px 36px; margin-top: -124px; text-align: center; }
.clip { width: 270px; max-width: 100%; border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); background: var(--ink); line-height: 0; }
.clip video { width: 100%; aspect-ratio: 886/1920; display: block; background: var(--ink); }
.lead h1 { font-size: 26px; line-height: 1.3; margin-top: 8px; }
.soft { color: var(--muted); line-height: 1.65; }
.note { font-size: 13px; color: var(--muted); }
.big { display: grid; gap: 10px; width: 100%; max-width: 320px; }
.big .btn { min-height: 56px; font-size: 17px; }
.shots { background: var(--paper); padding: 28px 0 32px; }
.shots h2 { font-size: 18px; margin: 0 20px 16px; }
.shots .note { margin: 10px 20px 0; font-size: 12px; }
.strip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 20px 8px; scroll-padding-left: 20px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip img { flex: none; width: 232px; height: 504px; object-fit: cover; scroll-snap-align: start; border: 2px solid var(--ink); background: var(--inset); }
.rows { display: grid; gap: 20px; padding: 28px 20px 32px; }
.rows > div { display: flex; gap: 14px; align-items: flex-start; }
.rows .n { flex: none; width: 32px; height: 32px; display: grid; place-items: center; background: var(--field); color: var(--cream); font-weight: 700; font-size: 14px; border: 2px solid var(--ink); }
.rows h3 { font-size: 16px; line-height: 1.4; }
.rows p { font-size: 14px; line-height: 1.6; color: var(--muted); margin-top: 4px; }
.go { padding: 0 20px 32px; }
.jump { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 2px solid var(--ink); background: var(--cream); box-shadow: 4px 4px 0 var(--ink); text-decoration: none; }
.jump span { flex: 1; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.jump b { font-size: 15px; color: var(--ink); }
/* shorter than the screen and scrolled past by a vertical swipe; the tear is a sideways one */
.try .stage { height: clamp(560px, calc(100svh - var(--bar) - 64px), 700px); touch-action: pan-y; }
.try .stage .title { width: min(46%, 200px); }
.try .pack { max-width: 260px; }
.foot .in { max-width: 520px; }

.stage .cover { position: absolute; inset: 0; background: center/cover no-repeat; }
.stage .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(26,28,23,.15), rgba(26,28,23,0) 30%, rgba(26,28,23,.55)); }
.stage .title { position: absolute; left: 50%; top: 4%; width: 46%; transform: translateX(-50%); image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(26,28,23,.5)); pointer-events: none; transition: opacity .3s; }
.pack { position: absolute; left: 50%; top: 52%; width: 56%; max-width: 300px; aspect-ratio: 5/8; transform: translate(-50%, -50%); transition: transform .6s var(--bounce), opacity .4s; }
.pack .body, .pack .flap { position: absolute; left: 0; right: 0; background: linear-gradient(115deg, #b9c2c9, #eef2f4 22%, #9aa5ae 40%, #e2e7ea 58%, #8f9aa3 78%, #d5dbdf); border: 2px solid var(--ink); }
.pack .body { top: 12%; bottom: 0; }
.pack .flap { top: 0; height: 13%; transform-origin: 0 100%; transition: transform .7s cubic-bezier(.2,.8,.3,1.2), opacity .7s; }
.pack .flap::after, .pack .body::after { content: ""; position: absolute; left: 0; right: 0; height: 8px; background: repeating-linear-gradient(90deg, rgba(26,28,23,.25) 0 2px, transparent 2px 5px); }
.pack .flap::after { top: 3px; } .pack .body::after { bottom: 3px; }
.pack .label { position: absolute; left: 9%; right: 9%; top: 9%; padding: 0; overflow: hidden; }
.pack .label .band { margin: 0; padding: 3px 8px; font-size: 12px; }
.pack .label .pic { display: block; width: 100%; aspect-ratio: 424/480; background: center/cover no-repeat; transition: background-image .3s; }
.pack .label .cap { font-size: 11px; padding: 3px 8px; text-align: center; }
.pack .tear { position: absolute; left: 0; top: 12%; height: 3px; width: 0; background: repeating-linear-gradient(90deg, var(--cream) 0 4px, var(--ink) 4px 6px); z-index: 2; }
.row { position: absolute; left: 4%; right: 4%; top: 32%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; perspective: 700px; transition: top .5s var(--bounce), transform .5s var(--bounce); }
.showcase { position: absolute; left: 50%; top: 44%; width: 52%; max-width: 240px; transform: translate(-50%, -50%); perspective: 900px; }
.showcase .card { width: 100%; }
.stage .hint { left: 16px; right: 16px; width: fit-content; margin: 0 auto; padding: 4px 10px; background: rgba(26,28,23,.6); }
.stage .auto { position: absolute; right: 12px; bottom: 12px; }
.result .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn .ic { width: 32px; height: 34px; image-rendering: pixelated; margin: -6px 0; }
.friend { position: absolute; left: 50%; top: 46%; width: 50%; max-width: 230px; transform: translate(-50%, -50%); perspective: 900px; z-index: 4;
  display: grid; gap: 10px; justify-items: center; transition: transform .5s cubic-bezier(.5,-0.4,.7,1), opacity .45s; }
.friend .chip { background: var(--cream); border: 2px solid var(--ink); font-size: 12px; font-weight: 700; padding: 2px 10px; box-shadow: 0 3px 0 var(--ink); animation: pop .45s var(--bounce) both; }
.friend .card { width: 100%; animation: deal .6s var(--bounce) both; }
.friend.tuck { transform: translate(-50%, 18%) scale(.2); opacity: 0; }
</style>
</head>
<body>
<header class="bar">
  <a class="me" href="#top"><img class="pix" src="img/icon.png" alt=""><span data-t="name"></span></a>
  <span class="gap"></span>
  <div class="langs" role="group" aria-label="Language"></div>
  <div class="stores" data-stores="bar"></div>
</header>

<main class="col" id="top">
  <section class="scape top"><img class="title pix" alt=""></section>

  <section class="lead">
    <div class="clip"><video muted loop playsinline preload="metadata"></video></div>
    <h1 data-t="h1"></h1>
    <p class="soft" data-t="resultBody"></p>
    <div class="stores big" data-stores="top"></div>
    <p class="note" data-t="when"></p>
  </section>

  <section class="shots">
    <h2 data-t="shotsH"></h2>
    <div class="strip" tabindex="0" role="group" data-t-label="shotsH"></div>
    <p class="note" data-t="shotsHint"></p>
  </section>

  <section class="rows">
    <div><span class="n">1</span><div><h3 data-t="s1h"></h3><p data-t="s1p"></p></div></div>
    <div><span class="n">2</span><div><h3 data-t="s2h"></h3><p data-t="s2p"></p></div></div>
    <div><span class="n">3</span><div><h3 data-t="s3h"></h3><p data-t="s3p"></p></div></div>
    <div><span class="n">4</span><div><h3 data-t="s4h"></h3><p data-t="s4p"></p></div></div>
  </section>

  <section class="go">
    <a class="jump" href="#tear"><span><b data-t="tryHere"></b><span data-t="tearHint"></span></span>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M5 11l5 5 5-5"/></svg></a>
  </section>

  <section class="try" id="tear">
    <div class="stage" id="stage">
      <div class="cover"></div>
      <img class="title" alt="">
      <div class="pack">
        <div class="body"><div class="win label"><div class="band"><span class="realm"></span><span data-t="pack"></span></div><div class="pic"></div><div class="cap" data-t="fiveCards"></div></div></div>
        <div class="flap"></div><div class="tear"></div>
      </div>
      <div class="row" hidden></div>
      <div class="showcase" hidden></div>
      <p class="hint" style="bottom:72px" data-t="tearHint"></p>
      <button class="btn ghost small auto" type="button" data-t="auto"></button>
      <div class="toast" role="status"></div>
      <div class="win result">
        <div class="band"><span class="got"></span><button class="btn ghost small again" type="button" data-t="again" style="min-height:28px;padding:0 8px"></button></div>
        <div class="acts"><button class="btn gold share" type="button"><img class="ic" src="img/share.png" alt=""><span data-t="share"></span></button></div>
        <p class="lead-in" data-t="resultBody" style="font-size:14px"></p>
        <div class="stores" data-stores="hero"></div>
        <a class="bridge" data-other><img class="pix" src="img/other.png" alt=""><span><span data-t="otherWhat"></span><br><b data-t="otherGo"></b></span></a>
      </div>
    </div>
  </section>

  <section class="scape close">
    <div class="last">
      <p data-t="endBody" style="line-height:1.65"></p>
      <div class="stores big" data-stores="end" style="max-width:none"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="in">
    <a class="win other bridge" data-other style="border-top:2px solid var(--ink)"><img class="pix" src="img/other.png" alt=""><span><span data-t="otherWhat"></span><br><b data-t="otherGo"></b></span></a>
    <nav><a href="odds/" data-t="wOdds"></a><a href="privacy.html" data-t="privacy"></a><a href="terms.html" data-t="terms"></a><a href="support.html" data-t="support"></a></nav>
    <small data-t="credits"></small>
  </div>
</footer>

<script src="links.js"></script>
<script src="site.js"></script>
<script src="data.js"></script>
<script src="page.js"></script>
</body>
</html>
